
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luftborn Products</title>

    <!-- Load the stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Product Management</h1>

    <!-- Form for creating a product -->
    <h2>Add Product</h2>

    <form id="product-form">
        <div>
            <label for="product-name">Product Name</label>
            <input type="text"
                   id="product-name"
                   name="name"
                   required>
        </div>

        <div>
            <label for="product-price">Price</label>
            <input type="number"
                   id="product-price"
                   name="price"
                   min="0.01"
                   step="0.01"
                   required>
        </div>

        <button type="submit">Add Product</button>
    </form>

    <!-- Existing elements -->
    <p id="status">Loading products...</p>
    <!-- Product list will contain product details and action buttons. -->
    <ul id="product-list"></ul>

    <script src="js/app.js"></script>
</body>

</html>
